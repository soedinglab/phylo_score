[package]
name = "phylo_score"
version = "0.1.0"
edition = "2024"
authors = ["Benjamin Lieser <benjamin.lieser@mpinat.mpg.de>"]
description = "Phylogeny aware RNA coevolution score"
repository = "https://github.com/soedinglab/phylo_score"
license = "MIT OR Apache-2.0"
categories = ["science::bioinformatics"]
rust-version = "1.87"

[lib]
name = "_phylo_score"
crate-type = ["cdylib", "rlib"]

[dependencies]
candle-core = "0.9.2"
candle-nn = "0.9.2"
lazy_static = "1.5.0"
phylo_grad = "2.4.0"
phylotree = "0.1.3"
rayon = "1.11.0"
seq_io = "0.3.4"
numpy = { version = "0.28.0"}
pyo3 = { version = "0.28.3", features = ["extension-module"] }
rand = "0.8"
